name: Phase 1 backend gate

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-test.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase-1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ATLAS_TEST_DATABASE_URL: postgresql+psycopg://atlas:atlas@127.0.0.1:5432/atlas_test
      ATLAS_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      DATABASE_URL: postgresql+psycopg://atlas:atlas@127.0.0.1:5432/atlas_test
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend and development gate
        run: python -m pip install -e "./backend[dev]"
      - name: Ruff
        working-directory: backend
        run: ruff check app tests
      - name: Strict mypy
        working-directory: backend
        run: mypy app
      - name: Unit, database, and API tests with coverage
        working-directory: backend
        run: |
          coverage run -m unittest discover -s tests -p "test_*.py" -v
          coverage report --fail-under=80
