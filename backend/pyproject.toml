[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "atlas-hedge-fund-os"
version = "0.4.0"
description = "ATLAS V4 research-only quantitative signal-engine foundation"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlmodel>=0.0.24,<1",
  "psycopg[binary]>=3.2,<4",
  "redis>=6,<7",
  "celery>=5.5,<6",
  "yfinance>=0.2.65,<1",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
  "coverage>=7.10,<8",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
  "app/main.py",
  "app/data/sec/cli.py",
  "app/models/tables.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
